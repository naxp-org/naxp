name: Release the amalgamation

# Runs when a version tag is pushed, such as v0.14.0, in the public repository: the tag is
# made and pushed in naxp after copy-to-public.ps1 has brought the release across. The
# release it creates is a draft, so the notes can be read and the assets checked before
# anything is public; publishing it is one click on GitHub, and that is what makes
# releases/latest resolve, which the libraries page, vcpkg and Conan all depend on.
#
# The library is built and its whole test suite run on the tag first, the amalgamation
# tests included, so no release ever attaches a single file that was not proved to be the
# library. The tag must name the version CMakeLists.txt states, or the run fails before it
# builds anything.
#
# The notes are the release's own section of library-changelog.md, headed `## [X.Y.Z]`, as C
# and C++ see it: text marked for another library alone is left out, which
# .github/scripts/changelog-section.awk does. So what a release says it contains is written
# by hand and reviewed like anything else. The section must exist and its markers must be well
# formed, or the run fails before it builds anything. The workflow adds what it can state for
# itself: what the attached files are, and which specification the libraries were tested
# against.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that the previous release's standard naxps can be read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag names the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9.]\+\)[[:space:]]*$/\1/p' src/cpp/CMakeLists.txt)"
          if [ "$tag" != "$version" ]; then
            echo "The tag is v$tag but src/cpp/CMakeLists.txt says $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Early, so that a missing section or a malformed marker fails the run before the build.
      - name: Read this release's section of the changelog
        run: |
          awk -v version="$VERSION" -v library=C -f .github/scripts/changelog-section.awk \
            library-changelog.md > "$RUNNER_TEMP/changes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/changes.md")" ]; then
            echo "The section headed ## [$VERSION] in library-changelog.md has nothing for C and C++." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/changes.md"

      # The specification is versioned separately from the packages, so it is read from the
      # documents rather than derived from the tag: naxp 0.14.0 the package implements naxp
      # 0.10 the language. Test data is published per minor version, so the data file is the
      # newest specification's major and minor.
      - name: Find the specification the release implements
        run: |
          spec="$(ls spec/naxp-v*.md 2>/dev/null | sed 's#.*/naxp-v##; s#\.md$##' | sort -V | tail -1)"
          if [ -z "$spec" ]; then
            echo "No specification found under spec/." >&2
            exit 1
          fi
          data="$(echo "$spec" | cut -d. -f1,2)"
          if [ ! -f "conformance/naxp-v$data.json" ]; then
            echo "The newest specification is $spec but conformance/naxp-v$data.json is missing." >&2
            exit 1
          fi
          echo "SPEC_VERSION=$spec" >> "$GITHUB_ENV"
          echo "DATA_VERSION=$data" >> "$GITHUB_ENV"

      # The standard naxps are generated into every library from standards/naxp-standards.json,
      # and the check fails if any library's copy was edited by hand or not regenerated. Once
      # published, a standard naxp never changes, because values stored under it would change
      # meaning: freeze.js compares this release's file with the one the newest earlier tag
      # published. A release from before the file existed has nothing to compare.
      - name: Check the standard naxps
        run: |
          node standards/generate.js --check
          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | awk -v current="$GITHUB_REF_NAME" 'found { print; exit } $0 == current { found = 1 }')"
          if [ -z "$previous" ]; then
            echo "There is no earlier release to compare the standard naxps with."
          elif git cat-file -e "$previous:standards/naxp-standards.json" 2>/dev/null; then
            git show "$previous:standards/naxp-standards.json" > "$RUNNER_TEMP/previous-standards.json"
            node standards/freeze.js "$RUNNER_TEMP/previous-standards.json" standards/naxp-standards.json
          else
            echo "$previous published no standard naxps, so there is nothing to compare."
          fi

      - name: Build and test the library
        run: |
          cmake -S src/cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Amalgamate
        run: |
          node src/cpp/tools/amalgamate.js --out release
          cp standards/naxp-standards.json release/
          cd release
          sha256sum naxp.cpp naxp.h naxp.hpp naxp-standards.json > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          {
            cat "$RUNNER_TEMP/changes.md"
            # The section is printed without a trailing blank line, and the heading below
            # would otherwise run straight on.
            echo

            cat <<'EOF'
          ## The files attached here

          These are the C and C++ library as one file. `naxp.cpp` is the whole library:
          compile it as C++17, with no include path. Your own code includes `naxp.hpp` from
          C++ or `naxp.h` from C. `naxp-standards.json` is the
          [standard naxps](https://naxp.org/standard/), which every library also carries built
          in. `SHA256SUMS` holds the digest of each file.

          ## Everything else in this release

          EOF

            cat <<EOF
          The same library builds from source with CMake under \`src/cpp\`. The other
          libraries are in the repository rather than attached here, and are installed from
          their own registries:

          - C# and .NET, \`src/cs\`, published to NuGet as \`naxp\`.
          - JavaScript, \`src/js\`, published to npm as \`@naxp/naxp\`.

          Every library passes the conformance data in
          \`conformance/naxp-v$DATA_VERSION.json\`, generated from the specification rather
          than from any library.

          It was tested against **naxp $SPEC_VERSION**, the specification as it stands. A
          package's own version and the specification's are separate, and each follows
          semantic versioning: see [the specification](https://naxp.org/spec/) for what each
          component governs.
          EOF
          } > release/notes.md

          cat release/notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "naxp $VERSION" \
            --notes-file release/notes.md \
            release/naxp.cpp release/naxp.h release/naxp.hpp release/naxp-standards.json \
            release/SHA256SUMS
